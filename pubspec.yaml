name: chongmi
description: 情侣恋爱记录 App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.1

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 图片相关
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1

  # 工具
  intl: ^0.19.0
  uuid: ^4.2.1
  path_provider: ^2.1.2

  # UI
  cupertino_icons: ^1.0.6
  
  # 动画与微交互
  lottie: ^3.1.2
  animate_do: ^3.3.4
  like_button: ^2.0.8

  # 图片与布局增强
  extended_image: any
  waterfall_flow: any

  # 日历与时间线
  table_calendar: ^3.1.2
  timeline_tile: ^2.0.0

  # 图表分析
  fl_chart: ^0.68.0
  http: ^1.6.0

  # 定位与地图
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # 网络与数据
  dio: ^5.7.0
  connectivity_plus: ^6.1.2

  # 分享与外部链接
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

  # 列表交互
  flutter_slidable: ^3.1.1

  # UI 增强
  shimmer: ^3.0.0
  confetti: ^0.7.0
  flutter_animate: ^4.5.2

  # 音效
  audioplayers: ^5.2.1

  # 路由
  go_router: ^14.8.1

  # 通知
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.8.0
  freezed_annotation: ^2.4.4
  freezed: ^2.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

